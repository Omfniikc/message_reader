[project]
name = "message-reader"
version = "0.1.0"
description = "Telegram summarizer: user-client reads chats on demand, bot is the interface, LLM generates summaries"
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.36",
    "aiogram>=3.17",
    "environs>=15.0.1",
    "openai>=1.60",
    "anthropic>=0.45",
    "aiohttp-socks>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
